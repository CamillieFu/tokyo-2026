<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tokyo Family Visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --surface-2:#EEF0F7; --line:#DFE2EC; --line-soft:#ECEEF4;
  --ink:#1B1E2B; --ink-2:#4A5068; --ink-3:#8A90A6; --out:#F0F1F6;
  --sun:#D23B34; --sat:#2E62C9; --accent:#2B3A67;
  --g1:#0E8A7C; --g1s:#DDF3EF; --g2:#C26A00; --g2s:#FCEBD5; --g3:#6D55C9; --g3s:#E9E4FA; --g4:#C73B68; --g4s:#FAE1E9;
  --hol:#D23B34; --hols:#FCE4E2; --bday:#9A6B00; --bdays:#FBF1D2;
  --joe:#2E62C9; --joes:#E3EBFB; --cam:#B0306A; --cams:#FBE3EE; --off:#D9582B; --offs:#FCE6DC; --note:#5E6480; --notes:#EEF0F6;
  --shadow:0 12px 40px rgba(27,30,43,.14);
  --ff-d:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --ff:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12141C; --surface:#1A1D28; --surface-2:#232736; --line:#2E3345; --line-soft:#262A3A;
    --ink:#ECEEF6; --ink-2:#B4B9CC; --ink-3:#7C8298; --out:#151821;
    --sun:#FF7A72; --sat:#7FA6FF; --accent:#AFC0F5;
    --g1:#3CC7B6; --g1s:#173A37; --g2:#F0A040; --g2s:#3D2C15; --g3:#A592F5; --g3s:#2D2848; --g4:#F07CA2; --g4s:#40202D;
    --hol:#FF7A72; --hols:#43211F; --bday:#F2C75C; --bdays:#3A3218;
    --joe:#8DB0FF; --joes:#212E4D; --cam:#F58BB9; --cams:#3F1F2E; --off:#FF956B; --offs:#43261B; --note:#A9AEC4; --notes:#262A3A;
    --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12141C; --surface:#1A1D28; --surface-2:#232736; --line:#2E3345; --line-soft:#262A3A;
  --ink:#ECEEF6; --ink-2:#B4B9CC; --ink-3:#7C8298; --out:#151821;
  --sun:#FF7A72; --sat:#7FA6FF; --accent:#AFC0F5;
  --g1:#3CC7B6; --g1s:#173A37; --g2:#F0A040; --g2s:#3D2C15; --g3:#A592F5; --g3s:#2D2848; --g4:#F07CA2; --g4s:#40202D;
  --hol:#FF7A72; --hols:#43211F; --bday:#F2C75C; --bdays:#3A3218;
  --joe:#8DB0FF; --joes:#212E4D; --cam:#F58BB9; --cams:#3F1F2E; --off:#FF956B; --offs:#43261B; --note:#A9AEC4; --notes:#262A3A;
  --shadow:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:14px;line-height:1.4;}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:var(--ff-d);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
h1 .jp{font-weight:500;color:var(--ink-3);font-size:.55em;margin-left:.4em;letter-spacing:.04em}
.sub{color:var(--ink-2);margin-top:6px;font-size:15px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{font:inherit;font-weight:600;font-size:13px;border:0;background:transparent;color:var(--ink-2);padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:focus-visible,.cellbtn:focus-visible,.close:focus-visible,.li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* who's here */
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.person{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.swatch{width:10px;align-self:stretch;border-radius:6px;background:var(--c)}
.person b{display:block;font-size:14.5px}
.person .dates{font-size:13px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
.person .fl{font-size:12px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}

/* month grid */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.dow div{padding:10px 10px 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.dow div small{font-weight:500;letter-spacing:0;margin-left:4px;opacity:.8}
.dow div:first-child{color:var(--sun)} .dow div:last-child{color:var(--sat)}
.week{position:relative;border-bottom:1px solid var(--line)}
.week:last-child{border-bottom:0}
.bgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
.cellbtn{border:0;border-right:1px solid var(--line-soft);background:transparent;cursor:pointer;padding:0;font:inherit;text-align:left}
.cellbtn:last-child{border-right:0}
.cellbtn:hover{background:var(--surface-2)}
.cellbtn.out{background:var(--out);cursor:default}
.cellbtn.sel{background:var(--surface-2)}
.fgrid{position:relative;display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;padding-bottom:10px;min-height:128px;pointer-events:none;align-content:start}
.num{padding:8px 10px 2px;display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.num b{font-family:var(--ff-d);font-weight:700;font-size:20px;line-height:1}
.num .hj{font-size:11px;font-weight:600;color:var(--hol)}
.num.sun b,.num.hol b{color:var(--sun)} .num.sat b{color:var(--sat)}
.num.out b{color:var(--ink-3);opacity:.6}
.off{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--offs);color:var(--off);flex:none}
.off svg{width:13px;height:13px}
.num .off{align-self:center}
.num .dn{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.03em}
.bar{height:20px;margin-inline:0;background:var(--cs);color:var(--c);font-size:11.5px;font-weight:700;display:flex;align-items:center;padding-inline:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid transparent}
.bar.s{border-left-color:var(--c);border-top-left-radius:6px;border-bottom-left-radius:6px;margin-left:6px}
.bar.e{border-top-right-radius:6px;border-bottom-right-radius:6px;margin-right:6px}
.bar.cont{border-left-color:transparent}
.day{display:flex;flex-direction:column;gap:3px;padding:4px 6px 0;min-width:0}
.chip{font-size:12px;line-height:1.3;padding:3px 7px;border-radius:6px;background:var(--cs);color:var(--c);font-weight:600;display:flex;gap:5px;align-items:flex-start;min-width:0;overflow-wrap:anywhere}
.chip svg{flex:none;width:12px;height:12px;margin-top:2px}
.chip.joe{background:var(--joes);color:var(--ink);font-weight:500}
.chip.joe .by{flex:none;font-size:9.5px;font-weight:700;color:#fff;background:var(--joe);border-radius:4px;padding:1px 4px;margin-top:1px;letter-spacing:.03em}
:root[data-theme="dark"] .chip.joe .by{color:#12141C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.joe .by{color:#12141C}}
.chip.cam{background:var(--cams);color:var(--ink);font-weight:500}
.chip.cam .by{flex:none;font-size:9.5px;font-weight:700;color:#fff;background:var(--cam);border-radius:4px;padding:1px 4px;margin-top:1px;letter-spacing:.03em}
.chip.cam a{color:var(--cam);font-weight:600}
.chip.note{background:transparent;color:var(--note);font-weight:500;font-style:italic;padding-inline:2px}

/* list view */
.list{display:flex;flex-direction:column;gap:10px}
.li{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:64px 1fr;gap:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.li:hover{border-color:var(--line)}
.li .d{display:flex;flex-direction:column;align-items:flex-start;font-variant-numeric:tabular-nums}
.li .d small{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.li .d b{font-family:var(--ff-d);font-size:26px;line-height:1.05}
.li .d.sun b,.li .d.hol b{color:var(--sun)} .li .d.sat b{color:var(--sat)}
.li .d em{font-style:normal;font-size:11px;color:var(--ink-3);margin-top:2px}
.li .d .off{margin-top:4px}
.li .items{display:flex;flex-direction:column;gap:4px;min-width:0}
.li .here{display:flex;gap:4px;margin-top:2px;flex-wrap:wrap}
.li .here i{width:18px;height:5px;border-radius:3px;background:var(--c)}
.wk{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:8px 2px 0}

/* detail drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.35);z-index:20}
.drawer{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);box-shadow:var(--shadow);padding:calc(22px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.drawer h2{font-family:var(--ff-d);font-size:28px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.drawer .hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.close{border:0;background:var(--surface-2);color:var(--ink);width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer;flex:none}
.drawer h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.drawer .items{display:flex;flex-direction:column;gap:6px}
.drawer .chip{font-size:14px;padding:8px 10px}
.drawer .chip svg{width:14px;height:14px}
.inlist{display:flex;flex-direction:column;gap:6px}
.inlist div{display:flex;align-items:center;gap:8px;font-weight:500}
.empty{color:var(--ink-3);font-size:14px}
.foot{color:var(--ink-3);font-size:12.5px}

@media (max-width:760px){
  .wrap{padding-inline:16px}
  .dow div{padding:8px 4px;text-align:center;font-size:11px}
  .dow div small{display:none}
  .num{padding:6px 4px 2px;justify-content:center}
  .num b{font-size:16px}
  .num .dn,.num .hj{display:none}
  .num{gap:3px}
  .num .off{width:15px;height:15px}
  .num .off svg{width:10px;height:10px}
  .fgrid{min-height:92px;padding-bottom:6px}
  .bar{height:6px;padding:0;font-size:0}
  .bar.s{margin-left:3px}.bar.e{margin-right:3px}
  .day{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px;padding:4px 2px 0}
  .chip{width:8px;height:8px;padding:0;border-radius:50%;font-size:0;background:var(--c)}
  .chip svg,.chip .by,.chip span{display:none}
  .chip.joe{background:var(--joe)}
  .chip.cam{background:var(--cam)}
  .chip.cam{background:var(--cams);color:var(--ink);font-weight:500}
.chip.cam .by{flex:none;font-size:9.5px;font-weight:700;color:#fff;background:var(--cam);border-radius:4px;padding:1px 4px;margin-top:1px;letter-spacing:.03em}
.chip.cam a{color:var(--cam);font-weight:600}
.chip.note{display:none}
  .drawer{top:auto;left:0;width:100%;max-height:85%;border-radius:18px 18px 0 0}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

];
// type: hol | bday | occ | note | joe | arr | dep
const EV={
 '2026-11-03':[{t:'hol',x:'Culture Day',jp:'文化の日'}],
 '2026-11-04':[{t:'dep',g:'jc',x:'Joe & Cathi leave SYR 6:30 AM (overnight flight)'}],
 '2026-11-07':[{t:'cam',x:'Tachikawa Tachihi Kabuki · 1:00 PM · Tachikawa Stage Garden',d:'Starts with the actors explaining kabuki, then Soga no Taimen, Shunkan and the spider dance Kumo no Hyoshimai. Tickets ¥3,000–¥17,000 (age 4+). 8 min walk from JR Tachikawa.',u:'https://event.tachihi.co.jp/kabuki/'},{t:'joe',x:'Asakusa'}],
 '2026-11-10':[{t:'cam',x:'Adults’ day: Nezu Museum + Japanese lunch with sake (no kids)',d:'10:00 Nezu Museum: bugaku court-dance costumes exhibition, ancient Chinese bronzes and the garden (about ¥1,600–1,800, book online). 12:30 lunch at Aoyama Hoshi no Naru Ki, refined Japanese food with drinks at lunch (about ¥6,000–8,000).',u:'https://www.nezu-muse.or.jp/jp/visit/'},{t:'cam',x:'Dinner at Washoku Sake Yu (和食 酒 由) · from 6 PM',d:'Small kappo-style counter with seasonal Japanese food and sake, 3 min from Soshigaya-Okura. Only 21 seats, so book on Tabelog. Ask Yuya to do Louis’s daycare pickup.',u:'https://tabelog.com/tokyo/A1318/A131814/13221720/'}],
 '2026-11-11':[{t:'joe',x:'Kakuuchi Festival (Ueno Park)'}],
 '2026-11-14':[{t:'cam',x:'Jindai Botanical Garden (Chofu)',d:'Big lawns for the kids, autumn roses (the Rose Festival runs through Nov 23) and fall colors. The Aquatic Plant Garden next door has wetland boardwalks. Lunch at the soba shops by Jindaiji temple. Open 9:30–17:00. Adults ¥500, 65+ ¥250, elementary school and younger free. Bus from Keio Chofu Station.',u:'https://www.tokyo-park.or.jp/park/jindai/index.html'},{t:'joe',x:'Kakuuchi Festival (Ueno Park)'}],
 '2026-11-15':[{t:'joe',x:'Kakuuchi Festival (Ueno Park)'}],
 '2026-11-16':[{t:'note',x:'Jordan & the girls plan their own days (about Nov 16–22)'}],
 '2026-11-17':[{t:'joe',x:'Kanazawa day trip'}],
 '2026-11-21':[{t:'joe',x:'Foods & Sake Fair'}],
 '2026-11-22':[{t:'cam',x:'Night kagura · 8:00 PM · Musashi Mitake Shrine (date to be confirmed)',d:'Free. Some dances are performed by firelight in front of the torii gate. About 2 hrs from home: JR Ome Line to Mitake, bus and cable car up, then a 25 min walk. The last cable car down is around 9:30 PM, so staying overnight at a shukubo on the mountain (from ¥8,800 per person, dinner and breakfast included) makes it easy. Nov 23 is a holiday. Bring warm layers.',u:'https://www.gotokyo.org/en/spot/ev053/index.html'},{t:'cam',x:'Overnight on Mt. Mitake at a shukubo (pilgrims’ inn)',d:'Top pick: Machiya (麻知家), right in front of the shrine gate, so it is a few steps home after the kagura. From ¥9,900 per person. Backup: Komadori Sanso (駒鳥山荘), from ¥8,800 with dinner and breakfast, 15 min walk from the shrine. Shops on the mountain close around 4 PM, so arrive early.',u:'https://baigo.fun/articles/syukubo-matome.html'},{t:'joe',x:'Foods & Sake Fair'},{t:'joe',x:'Asakusa + Tokyo Skytree'}],

 '2026-11-24':[{t:'joe',x:'Meiji Shrine + Harajuku'}],
 '2026-11-25':[{t:'note',x:'Jordan & the girls back from Kyoto'},{t:'joe',x:'Shibuya → Harajuku → Shinjuku (Tokyo Metropolitan Government Building)'}],
 '2026-11-26':[{t:'occ',x:'Thanksgiving in Tokyo'},{t:'cam',x:'Thanksgiving dinner, whole family · Soul Food House (Azabujuban)',d:'Southern & Cajun restaurant with a private party option. Reserve by Nov 1, once everyone has agreed to the price. Each family pays for itself.',u:'https://soulfoodhouse.com/private-party'}],

 '2026-11-29':[{t:'joe',x:'SAKANA & JAPAN Festival (Hibiya Park)'}],
 '2026-11-30':[{t:'joe',x:'SAKANA & JAPAN Festival (Hibiya Park)'}]
};
// arrivals / departures from stays
STAYS.forEach(s=>{

});
const OFF=new Set(['2026-11-06','2026-11-10','2026-11-17','2026-11-26','2026-11-27','2026-12-01']);

const TRIP0='2026-11-04', TRIP1='2026-12-01', DAY1='2026-11-05';
const PLANE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>';
const CAKE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 6a2 2 0 0 0 2-2c0-.38-.1-.73-.29-1.03L12 0l-1.71 2.97A2 2 0 0 0 12 6zm6 3h-5V7h-2v2H6a3 3 0 0 0-3 3v1.54c0 1.08.88 1.96 1.96 1.96.52 0 1.02-.2 1.38-.57L8.5 12.8l2.13 2.13a1.98 1.98 0 0 0 2.76 0l2.14-2.13 2.13 2.13c.37.37.86.57 1.38.57 1.08 0 1.96-.88 1.96-1.96V12a3 3 0 0 0-3-3zm-1.54 7.9L15.5 16l-1.08 1.07a3.98 3.98 0 0 1-5.84 0L7.5 16l-.97.9A3.9 3.9 0 0 1 4 17.8V21a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3.2a3.9 3.9 0 0 1-3.54-.9z"/></svg>';
const STAR='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21.2l1.6-7L2 9.5l7.1-.6z"/></svg>';
const LEAF='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 8C8 10 5.9 16.2 3.8 21.3l1.9.7.9-2.3c.5.2 1 .3 1.4.3C19 20 22 3 22 3c-1 2-8 2.3-13 3.3S2 11.5 2 13.5 3.8 17.3 3.8 17.3C7 8 17 8 17 8z"/></svg>';

const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const OFFI=`<span class="off" title="Camille – tentative day off">${SUN}</span>`;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const iso=d=>d.toISOString().slice(0,10);
const D=s=>new Date(s+'T00:00:00Z');
const addDays=(d,n)=>{const x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x};
const inTrip=k=>k>=TRIP0&&k<=TRIP1;
const dayNum=k=>k<DAY1||k>TRIP1?null:Math.round((D(k)-D(DAY1))/864e5)+1;
const stayOf=id=>STAYS.find(s=>s.id===id);
const here=k=>STAYS.filter(s=>k>=s.from&&k<=s.to);
const evs=k=>(EV[k]||[]).slice().sort((a,b)=>ORDER[a.t]-ORDER[b.t]);
const isHol=k=>(EV[k]||[]).some(e=>e.t==='hol');
const fmtLong=k=>D(k).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'});
const fmtShort=k=>D(k).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});

function chip(e,full){
  const st=e.g?stayOf(e.g):null;
  if(e.t==='arr'||e.t==='dep'){
    return `<div class="chip" style="--c:var(${st.c});--cs:var(${st.c}s)">${PLANE}<span>${esc(e.x)}</span></div>`;
  }
  if(e.t==='hol')return `<div class="chip" style="--c:var(--hol);--cs:var(--hols)">${STAR}<span>${esc(e.x)}${e.jp?' · '+e.jp:''}</span></div>`;
  if(e.t==='bday')return `<div class="chip" style="--c:var(--bday);--cs:var(--bdays)">${CAKE}<span>${esc(e.x)}</span></div>`;
  if(e.t==='occ')return `<div class="chip" style="--c:var(--g2);--cs:var(--g2s)">${LEAF}<span>${esc(e.x)}</span></div>`;
  if(e.t==='note')return `<div class="chip note" style="--c:var(--note)"><span>${esc(e.x)}</span></div>`;
  if(e.t==='cam')return `<div class="chip cam" style="--c:var(--cam)"><span class="by">CAMILLE</span><span>${esc(e.x)}${full&&e.d?`<br><span style="color:var(--ink-2)">${esc(e.d)}</span>`:''}${full&&e.u?`<br><a href="${e.u}" target="_blank" rel="noopener">Event page ↗</a>`:''}</span></div>`;
  if(e.t==='joe')return `<div class="chip joe" style="--c:var(--joe)"><span class="by">JOE</span><span>${esc(e.x)}</span></div>`;
  return '';
}

// who's here + legend
$('#who').innerHTML=STAYS.map(s=>`<div class="person" style="--c:var(${s.c})"><div class="swatch"></div><div><b>${esc(s.name)}</b><div class="dates">${fmtShort(s.from)} – ${fmtShort(s.to)}</div><div class="fl">Arrive ${esc(s.arr)} · Leave ${esc(s.dep)}</div></div></div>`).join('');
$('#legend').innerHTML=[
  ['--cam','Camille’s picks'],['--joe','Joe’s suggestions'],['--bday','Birthday'],['--hol','Japanese national holiday'],['--note','Plans & notes']
].map(([c,l])=>`<span><i class="dot" style="--c:var(${c})"></i>${l}</span>`).join('')+`<span>${OFFI}Camille – tentative day off</span>`+`<span style="color:var(--ink-3)">Colored bars show who is in Tokyo each day</span>`;

// month grid: Sun Nov 1 → Sat Dec 5
const start=D('2026-11-01');
let weeksHtml='';
for(let w=0;w<5;w++){
  const days=[...Array(7)].map((_,i)=>iso(addDays(start,w*7+i)));
  const wk0=days[0],wk6=days[6];
  const segs=[];
  STAYS.forEach((s,lane)=>{
    if(s.to<wk0||s.from>wk6)return;
    const a=Math.max(0,days.indexOf(s.from<wk0?wk0:s.from));
    const b=days.indexOf(s.to>wk6?wk6:s.to);
    segs.push({s,lane,a,b,st:s.from>=wk0,en:s.to<=wk6});
  });
  const lanes=segs.length?Math.max(...segs.map(x=>x.lane))+1:0;
  const evRow=2+lanes;
  let bg='',fg='';
  days.forEach((k,i)=>{
    const out=!inTrip(k);
    const d=D(k);const dn=dayNum(k);
    const cls=['num',i===0?'sun':'',i===6?'sat':'',isHol(k)?'hol':'',out?'out':''].join(' ');
    const label=(d.getUTCDate()===1)?d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}):d.getUTCDate();
    const hol=(EV[k]||[]).find(e=>e.t==='hol');
    bg+=`<button type="button" class="cellbtn${out?' out':''}" data-k="${k}" aria-label="${fmtLong(k)}"${out&&!(EV[k]||[]).length?' tabindex="-1"':''}></button>`;
    fg+=`<div class="${cls}" style="grid-column:${i+1};grid-row:1"><b>${label}</b>${hol?'<span class="hj">祝</span>':''}${OFF.has(k)?OFFI:''}${dn?`<span class="dn">DAY ${dn}</span>`:''}</div>`;
    const list=evs(k);
    if(list.length)fg+=`<div class="day" style="grid-column:${i+1};grid-row:${evRow}">${list.map(e=>chip(e)).join('')}</div>`;
  });
  segs.forEach(g=>{
    const cls=['bar',g.st?'s':'cont',g.en?'e':''].join(' ');
    const lab=g.st||g.a===0?g.s.name:'';
    fg+=`<div class="${cls}" style="grid-column:${g.a+1}/${g.b+2};grid-row:${2+g.lane};--c:var(${g.s.c});--cs:var(${g.s.c}s)">${esc(lab)}</div>`;
  });
  // empty spacer rows for unused lanes so heights align
  for(let l=0;l<lanes;l++){ if(!segs.some(g=>g.lane===l)) fg+=`<div style="grid-column:1;grid-row:${2+l};height:20px"></div>`; }
  weeksHtml+=`<div class="week"><div class="bgrid">${bg}</div><div class="fgrid">${fg}</div></div>`;
}
$('#weeks').innerHTML=weeksHtml;

// list view
let lh='',lastW=-1;
for(let k=TRIP0;k<=TRIP1;k=iso(addDays(D(k),1))){
  const d=D(k),dow=d.getUTCDay();
  const w=Math.floor((d-start)/(7*864e5));
  if(w!==lastW){lastW=w;const ws=iso(addDays(start,w*7)),we=iso(addDays(start,w*7+6));lh+=`<div class="wk">Week of ${fmtShort(ws)} – ${fmtShort(we)}</div>`;}
  const list=evs(k),h=here(k),dn=dayNum(k);
  const cls=['d',dow===0?'sun':'',dow===6?'sat':'',isHol(k)?'hol':''].join(' ');
  lh+=`<button type="button" class="li" data-k="${k}"><div class="${cls}"><small>${d.toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'})}</small><b>${d.getUTCDate()}</b>${dn?`<em>Day ${dn}</em>`:''}${OFF.has(k)?OFFI:''}<div class="here">${h.map(s=>`<i style="--c:var(${s.c})" title="${esc(s.name)}"></i>`).join('')}</div></div><div class="items">${list.length?list.map(e=>chip(e)).join(''):'<span class="empty">Open day</span>'}</div></button>`;
}
$('#listView').innerHTML=lh;

// drawer
let lastFocus=null;
function openDay(k){
  lastFocus=document.activeElement;
  document.querySelectorAll('.cellbtn.sel').forEach(b=>b.classList.remove('sel'));
  document.querySelector(`.cellbtn[data-k="${k}"]`)?.classList.add('sel');
  const list=evs(k),h=here(k),dn=dayNum(k);
  const joe=list.filter(e=>e.t==='joe'),cam=list.filter(e=>e.t==='cam'),rest=list.filter(e=>e.t!=='joe'&&e.t!=='cam');
  $('#drawer').innerHTML=`
    <div class="hd"><div><div class="eyebrow">${dn?`Day ${dn} of 27`:(k===TRIP0?'Travel day':'Before the trip')}</div><h2>${fmtLong(k)}</h2></div><button class="close" id="closeBtn" type="button" aria-label="Close">×</button></div>
    <div><h3>In Tokyo</h3>${h.length?`<div class="inlist">${h.map(s=>`<div><i class="dot" style="--c:var(${s.c})"></i>${esc(s.name)}</div>`).join('')}</div>`:'<div class="empty">No visitors yet</div>'}</div>
    ${OFF.has(k)?`<div class="inlist"><div>${OFFI}Camille – tentative day off</div></div>`:''}
    <div><h3>What’s happening</h3>${rest.length?`<div class="items">${rest.map(e=>chip(e)).join('')}</div>`:'<div class="empty">Nothing scheduled</div>'}</div>
    ${cam.length?`<div><h3>Camille’s picks</h3><div class="items">${cam.map(e=>chip(e,true)).join('')}</div></div>`:''}
    <div><h3>Joe’s suggestions</h3>${joe.length?`<div class="items">${joe.map(e=>chip(e)).join('')}</div>`:'<div class="empty">None for this day</div>'}</div>`;
  $('#drawer').hidden=false;$('#scrim').hidden=false;
  $('#closeBtn').focus();
  $('#closeBtn').onclick=closeDay;
}
function closeDay(){
  $('#drawer').hidden=true;$('#scrim').hidden=true;
  document.querySelectorAll('.cellbtn.sel').forEach(b=>b.classList.remove('sel'));
  lastFocus?.focus?.();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-k]');
  if(b&&!(b.classList.contains('out')&&!(EV[b.dataset.k]||[]).length))openDay(b.dataset.k);
});
$('#scrim').addEventListener('click',closeDay);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#drawer').hidden)closeDay();});

// view toggle
function setView(v){
  $('#monthView').hidden=v!=='month';$('#listView').hidden=v!=='list';
  $('#vMonth').setAttribute('aria-pressed',v==='month');$('#vList').setAttribute('aria-pressed',v==='list');
  try{localStorage.setItem('tokyoView',v)}catch(_){}
}
$('#vMonth').onclick=()=>setView('month');$('#vList').onclick=()=>setView('list');
let saved=null;try{saved=localStorage.getItem('tokyoView')}catch(_){}
setView(saved||(window.innerWidth<560?'list':'month'));
</script>

</body>
</html>
